<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Add Pose</title>
    <link rel="stylesheet" href="/css/styles.css?v=settings-library-sections-2">
    <script src="/js/appearance-settings.js?v=settings-library-sections-2"></script>
    <script src="/js/form-navigation.js?v=search-clear-visible-2" defer></script>
    <script src="/js/poses.js?v=preview-editor-7" defer></script>
    <script src="/js/gallery-header.js?v=shared-menu-alignment-2" defer></script>
    <script src="/js/edit-field-tools.js?v=expanded-text-2" defer></script>
    <script src="/js/preview-media.js" defer></script>
    <script src="/js/preview-editor.js?v=6" defer></script>
    <script src="/js/application-settings.js?v=desktop-1" defer></script>
</head>
<body>
<main class="add-lora-page record-form-page">
    <div class="add-lora-container content-container">
        <header class="add-lora-header">
            <button id="optionsButton" class="options-button" type="button" aria-label="Open navigation menu" aria-controls="sideMenu" aria-expanded="false">☰</button>
            <h1 id="poseFormTitle">Add Pose</h1>
            <button id="closePoseFormButton" class="page-close-button" type="button" aria-label="Cancel and return" title="Return to Gallery"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button>
        </header>
        <div id="menuBackdrop" class="menu-backdrop hidden" aria-hidden="true"></div>
        <nav id="sideMenu" class="side-menu hidden" aria-label="Main navigation" aria-hidden="true">
            <div class="side-menu-header"><h2>Menu</h2></div>
            <a href="/html/index.html" class="side-menu-link"><span class="compact-action-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h5v16H4zM10 4h5v16h-5zM17 4l4 1-3 15-4-1z"/></svg></span><span>Library</span></a>
            <a href="/html/poses.html" class="side-menu-link"><span class="compact-action-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg></span><span>Gallery</span></a>
        </nav>
        <form id="poseForm" class="add-lora-form" enctype="multipart/form-data">
            <input id="poseIdInput" name="id" type="hidden">
            <section class="add-image-section">
                <div id="poseImagePreviewContainer" class="details-image-container add-image-preview"></div>
                <input id="poseImagesInput" name="images" hidden disabled aria-hidden="true" class="hidden-file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple>
                <div id="poseSelectedImages" aria-live="polite"></div>
                <div id="poseExistingImages"></div>
            </section>
            <section class="details-edit-grid add-lora-details-grid">
                <label class="details-edit-full-width"><strong class="record-input-label">Pose Name</strong>
                    <input id="poseNameInput" name="name" class="details-edit-input" type="text" maxlength="255" required>
                </label>
                <label><strong class="record-input-label">Category</strong>
                    <input id="poseCategoryInput" name="category" class="details-edit-input" type="text" maxlength="255" list="poseCategorySuggestions">
                    <datalist id="poseCategorySuggestions"></datalist>
                </label>
                <label><strong class="record-input-label">Base Model</strong>
                    <input id="poseBaseModelInput" name="baseModel" class="details-edit-input" type="text" maxlength="255">
                </label>
                <label><strong class="record-input-label">Seed</strong>
                    <input id="poseSeedInput" name="seed" class="details-edit-input" type="number" step="1" min="-2147483648" max="2147483647">
                </label>
            </section>
            <section class="details-prompt-section">
                <div class="details-field-header">
                    <h2 class="details-field-label"><label for="poseLoraInput">LoRAs / Strengths</label></h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="poseLoraInput" data-copy-label="Copy LoRAs / Strengths" aria-label="Copy LoRAs / Strengths" title="Copy">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="poseLoraInput" data-field-label="LoRAs / Strengths" aria-label="Expand LoRAs / Strengths" title="Expand">⛶</button>
                    </div>
                </div>
                <textarea id="poseLoraInput" name="lora" class="details-edit-textarea" rows="4"></textarea>
            </section>
            <section class="details-prompt-section">
                <div class="details-field-header">
                    <h2 class="details-field-label"><label for="posePromptInput">Prompt</label></h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="posePromptInput" data-copy-label="Copy Prompt" aria-label="Copy Prompt" title="Copy">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="posePromptInput" data-field-label="Prompt" aria-label="Expand Prompt" title="Expand">⛶</button>
                    </div>
                </div>
                <textarea id="posePromptInput" name="prompt" class="details-edit-textarea" rows="8"></textarea>
            </section>
            <section class="details-prompt-section">
                <div class="details-field-header">
                    <h2 class="details-field-label"><label for="poseNotesInput">Notes</label></h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="poseNotesInput" data-copy-label="Copy Notes" aria-label="Copy Notes" title="Copy">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="poseNotesInput" data-field-label="Notes" aria-label="Expand Notes" title="Expand">⛶</button>
                    </div>
                </div>
                <textarea id="poseNotesInput" name="notes" class="details-edit-textarea" rows="6"></textarea>
            </section>
            <p id="poseFormMessage" class="details-edit-message hidden" role="status" aria-live="polite"></p>
            <div class="shared-form-action-bar add-lora-action-bar">
                <button id="cancelPoseFormButton" class="details-cancel-button" type="button">Cancel</button>
                <button id="savePoseButton" class="details-save-button" type="submit">Save Pose</button>
            </div>
        </form>
    </div>
</main>
<div id="expandedFieldEditor" class="expanded-text-modal hidden" role="dialog" aria-modal="true" aria-labelledby="expandedFieldTitle" aria-hidden="true" inert>
    <section class="expanded-text-sheet">
        <header class="expanded-text-header">
            <h2 id="expandedFieldTitle">Edit text</h2>
            <button id="closeExpandedFieldEditor" class="close-button" type="button" aria-label="Apply expanded text and close">×</button>
        </header>
        <textarea id="expandedFieldValue" class="details-edit-textarea expanded-field-value" aria-label="Expanded text"></textarea>
    </section>
</div>

<dialog id="poseImagePicker" class="output-page-dialog" aria-label="Choose a preview">
    <iframe id="outputPageFrame" title="ComfyUI output preview selection"></iframe>
</dialog>
</body>
</html>
