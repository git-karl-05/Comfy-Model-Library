<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Add Pose</title>
    <link rel="stylesheet" href="/css/styles.css?v=uniform-filter-width-1">
    <script src="/js/appearance-settings.js?v=settings-pagination-1"></script>
    <script src="/js/form-navigation.js" defer></script>
    <script src="/js/poses.js?v=pose-picker-2" defer></script>
</head>
<body>
<main class="add-lora-page record-form-page">
    <div class="add-lora-container content-container">
        <header class="add-lora-header">
            <button id="optionsButton" class="options-button" type="button" aria-label="Open navigation menu" aria-controls="sideMenu" aria-expanded="false">☰</button>
            <h1 id="poseFormTitle">Add Pose</h1>
            <button id="closePoseFormButton" class="page-close-button" type="button" aria-label="Cancel and return" title="Return to Pose Gallery"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button>
        </header>
        <div id="menuBackdrop" class="menu-backdrop hidden" aria-hidden="true"></div>
        <nav id="sideMenu" class="side-menu hidden" aria-label="Main navigation" aria-hidden="true">
            <div class="side-menu-header"><h2>Menu</h2><button id="closeMenuButton" class="menu-close-button" type="button" aria-label="Close navigation menu">×</button></div>
            <a href="/html/index.html" class="side-menu-link">LoRA Library</a>
            <a href="/html/poses.html" class="side-menu-link">Pose Gallery</a>
        </nav>
        <form id="poseForm" class="add-lora-form" enctype="multipart/form-data">
            <input id="poseIdInput" name="id" type="hidden">
            <section class="add-image-section">
                <label id="poseImagePreviewContainer" tabindex="0" role="button" aria-label="Choose pose preview from ComfyUI" class="details-image-container add-image-preview">
                    <div class="lora-card-placeholder">Tap to choose from ComfyUI</div>
                </label>
                <input id="poseImagesInput" name="images" hidden disabled aria-hidden="true" class="hidden-file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple>
                <div id="poseSelectedImages" aria-live="polite"></div>
                <div id="poseExistingImages"></div>
            </section>
            <section class="details-edit-grid add-lora-details-grid">
                <label class="details-edit-full-width">Pose Name
                    <input id="poseNameInput" name="name" class="details-edit-input" type="text" maxlength="255" required>
                </label>
                <label>Category
                    <input id="poseCategoryInput" name="category" class="details-edit-input" type="text" maxlength="255" list="poseCategorySuggestions">
                    <datalist id="poseCategorySuggestions"></datalist>
                </label>
                <label>Base Model
                    <input id="poseBaseModelInput" name="baseModel" class="details-edit-input" type="text" maxlength="255">
                </label>
                <label>Seed
                    <input id="poseSeedInput" name="seed" class="details-edit-input" type="number" step="1" min="-2147483648" max="2147483647">
                </label>
            </section>
            <section class="details-prompt-section">
                <h2><label for="poseLoraInput">LoRAs / Strengths</label></h2>
                <textarea id="poseLoraInput" name="lora" class="details-edit-textarea" rows="4"></textarea>
            </section>
            <section class="details-prompt-section">
                <h2><label for="posePromptInput">Prompt</label></h2>
                <textarea id="posePromptInput" name="prompt" class="details-edit-textarea" rows="8"></textarea>
            </section>
            <section class="details-prompt-section">
                <h2><label for="poseNotesInput">Notes</label></h2>
                <textarea id="poseNotesInput" name="notes" class="details-edit-textarea" rows="6"></textarea>
            </section>
            <p id="poseFormMessage" class="details-edit-message hidden" role="status" aria-live="polite"></p>
            <div class="shared-form-action-bar add-lora-action-bar">
                <button id="cancelPoseFormButton" class="details-cancel-button" type="button">Cancel</button>
                <button id="savePoseButton" class="details-save-button" type="submit">Save Pose</button>
            </div>
        </form>
    </div>
</main>
<dialog id="poseImagePicker" class="output-page-dialog" aria-label="Choose a preview">
    <iframe id="outputPageFrame" title="ComfyUI output preview selection"></iframe>
</dialog>
</body>
</html>
