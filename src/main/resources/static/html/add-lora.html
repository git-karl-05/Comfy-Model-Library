<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Add LoRA</title>

    <link rel="stylesheet" href="/css/styles.css?v=settings-library-sections-2">
    <script src="/js/appearance-settings.js?v=settings-library-sections-2"></script>
    <script src="/js/form-navigation.js?v=search-clear-visible-2" defer></script>
    <script src="/js/add-lora.js?v=add-lora-spacing-1" defer></script>
    <script src="/js/edit-field-tools.js?v=expanded-text-2" defer></script>
    <script src="/js/gallery-header.js?v=shared-menu-alignment-2" defer></script>
    <script src="/js/preview-media.js" defer></script>
    <script src="/js/preview-editor.js?v=6" defer></script>
    <script src="/js/application-settings.js?v=desktop-1" defer></script>
</head>

<body>

<main class="add-lora-page record-form-page">

    <div class="add-lora-container content-container">


        <header class="add-lora-header">

            <button
                    type="button"
                    id="optionsButton"
                    class="options-button"
                    aria-label="Open navigation menu"
                    aria-controls="sideMenu"
                    aria-expanded="false">
                ☰
            </button>

            <h1>Add LoRA</h1>

            <a
                    href="/html/index.html"
                    class="page-close-button"
                    aria-label="Cancel and return to Library"
                    title="Return to Library"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a>

        </header>

        <div
                id="menuBackdrop"
                class="menu-backdrop hidden"
                aria-hidden="true">
        </div>

        <nav
                id="sideMenu"
                class="side-menu hidden"
                aria-label="Main navigation"
                aria-hidden="true">

            <div class="side-menu-header">
                <h2>Menu</h2>


            </div>

            <a href="/html/index.html" class="side-menu-link"><span class="compact-action-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h5v16H4zM10 4h5v16h-5zM17 4l4 1-3 15-4-1z"/></svg></span><span>Library</span></a>

            <a href="/html/poses.html" class="side-menu-link"><span class="compact-action-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg></span><span>Gallery</span></a>

        </nav>


        <form id="addLoraForm" class="add-lora-form">


            <section class="add-image-section">

                <div id="addImagePreviewContainer" class="details-image-container add-image-preview"></div>

                <input
                        type="file"
                        id="previewImage"
                        name="previewImage"
                        class="hidden-file-input"
                        accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,video/quicktime,video/ogg"
                >


            </section>


            <section class="details-edit-grid add-lora-details-grid">

                <label class="details-edit-full-width">
                    <strong class="record-input-label">LoRA Name</strong>

                    <input
                            type="text"
                            id="loraName"
                            name="loraName"
                            class="details-edit-input"
                            required
                    >
                </label>

                <label class="details-edit-full-width">
                    <strong class="record-input-label">Creator</strong>

                    <input
                            type="text"
                            id="creator"
                            name="creator"
                            class="details-edit-input"
                    >
                </label>

                <label>
                    <strong class="record-input-label">Version</strong>

                    <input
                            type="text"
                            id="version"
                            name="version"
                            class="details-edit-input"
                    >
                </label>

                <label>
                    <strong class="record-input-label">Category</strong>

                    <select
                            id="category"
                            name="category"
                            class="details-edit-input"
                            required>

                        <option value="">
                            Select category
                        </option>

                    </select>
                </label>

                <label>
                    <strong class="record-input-label">Subcategory</strong>

                    <input
                            type="text"
                            id="subCategory"
                            name="subCategory"
                            class="details-edit-input"
                    >
                </label>

                <label>
                    <strong class="record-input-label">Base Model</strong>

                    <input
                            type="text"
                            id="baseModel"
                            name="baseModel"
                            class="details-edit-input"
                    >
                </label>

            </section>


            <section class="details-prompt-section">
                <div class="details-field-header">
                    <h2 class="details-field-label" id="positivePromptLabel">Trained Words</h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="positivePrompt" data-copy-label="Copy Trained Words" aria-label="Copy Trained Words" title="Copy Trained Words">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="positivePrompt" data-field-label="Trained Words" aria-label="Expand Trained Words" title="Expand Trained Words">⛶</button>
                    </div>
                </div>

                <textarea
                        id="positivePrompt"
                        aria-labelledby="positivePromptLabel"
                        name="positivePrompt"
                        class="details-edit-textarea"
                        rows="8"
                        placeholder="Enter the trained words..."></textarea>
            </section>


            <section class="details-prompt-section">
                <div class="details-field-header">
                    <h2 class="details-field-label" id="promptLabel">Prompt</h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="prompt" data-copy-label="Copy Prompt" aria-label="Copy Prompt" title="Copy Prompt">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="prompt" data-field-label="Prompt" aria-label="Expand Prompt" title="Expand Prompt">⛶</button>
                    </div>
                </div>
                <textarea id="prompt" name="prompt" aria-labelledby="promptLabel" class="details-edit-textarea" rows="8" maxlength="5000" placeholder="Enter the prompt..."></textarea>
            </section>

            <section class="details-prompt-section">
                <div class="details-field-header">
                    <h2 class="details-field-label" id="notesLabel">Notes</h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="notes" data-copy-label="Copy Notes" aria-label="Copy Notes" title="Copy Notes">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="notes" data-field-label="Notes" aria-label="Expand Notes" title="Expand Notes">⛶</button>
                    </div>
                </div>

                <textarea
                        id="notes"
                        aria-labelledby="notesLabel"
                        name="notes"
                        class="details-edit-textarea"
                        rows="6"
                        placeholder="Add notes about this LoRA..."></textarea>
            </section>


            <p
                    id="addLoraMessage"
                    class="details-edit-message hidden"
                    aria-live="polite">
            </p>


            <div class="shared-form-action-bar add-lora-action-bar">

                <a
                        href="/html/index.html"
                        class="details-cancel-button add-cancel-button">
                    Cancel
                </a>

                <button
                        type="submit"
                        id="saveLoraButton"
                        class="details-save-button">
                    Save LoRA
                </button>

            </div>

        </form>

    </div>

</main>

<div id="expandedFieldEditor" class="expanded-text-modal hidden" role="dialog" aria-modal="true" aria-labelledby="expandedFieldTitle" aria-hidden="true" inert>
    <section class="expanded-text-sheet">
        <header class="expanded-text-header">
            <h2 id="expandedFieldTitle">Edit text</h2>
            <button id="closeExpandedFieldEditor" class="close-button" type="button" aria-label="Apply expanded text and close">×</button>
        </header>
        <textarea id="expandedFieldValue" class="details-edit-textarea expanded-field-value" aria-label="Expanded text"></textarea>
    </section>
</div>

<dialog id="formOutputPicker" class="output-page-dialog" aria-label="Choose a preview"><iframe title="ComfyUI output preview selection"></iframe></dialog>
</body>
</html>
