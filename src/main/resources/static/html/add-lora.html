<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Add LoRA</title>

    <link rel="stylesheet" href="/css/styles.css?v=uniform-filter-width-1">
    <script src="/js/appearance-settings.js?v=settings-pagination-1"></script>
    <script src="/js/form-navigation.js" defer></script>
    <script src="/js/add-lora.js?v=lora-prompt-1" defer></script>
    <script src="/js/edit-field-tools.js" defer></script>
</head>

<body>

<main class="add-lora-page record-form-page">

    <div class="add-lora-container content-container">


        <header class="add-lora-header">

            <button
                    type="button"
                    id="optionsButton"
                    class="options-button"
                    aria-label="Open navigation menu"
                    aria-controls="sideMenu"
                    aria-expanded="false">
                ☰
            </button>

            <h1>Add LoRA</h1>

            <a
                    href="/html/index.html"
                    class="page-close-button"
                    aria-label="Cancel and return to LoRA Library"
                    title="Return to LoRA Library"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a>

        </header>

        <div
                id="menuBackdrop"
                class="menu-backdrop hidden"
                aria-hidden="true">
        </div>

        <nav
                id="sideMenu"
                class="side-menu hidden"
                aria-label="Main navigation"
                aria-hidden="true">

            <div class="side-menu-header">
                <h2>Menu</h2>

                <button
                        type="button"
                        id="closeMenuButton"
                        class="menu-close-button"
                        aria-label="Close navigation menu">
                    ×
                </button>
            </div>

            <a href="/html/index.html" class="side-menu-link">
                LoRA Library
            </a>

            <a href="/html/poses.html" class="side-menu-link">
                Pose Gallery
            </a>

        </nav>


        <form id="addLoraForm" class="add-lora-form">


            <section class="add-image-section">

                <label
                        id="addImagePreviewContainer"
                        class="details-image-container add-image-preview"
                        for="previewImage">

                    <div class="lora-card-placeholder">
                        Click to choose a preview image
                    </div>

                    <button
                            type="button"
                            id="removePreviewImageButton"
                            class="remove-preview-image-button hidden"
                            aria-label="Remove preview image"
                            title="Remove preview image">
                        ×
                    </button>

                </label>

                <input
                        type="file"
                        id="previewImage"
                        name="previewImage"
                        class="hidden-file-input"
                        accept="image/png,image/jpeg,image/webp,image/gif"
                >



            </section>


            <section class="details-edit-grid add-lora-details-grid">

                <label class="details-edit-full-width">
                    LoRA Name

                    <input
                            type="text"
                            id="loraName"
                            name="loraName"
                            class="details-edit-input"
                            required
                    >
                </label>

                <label class="details-edit-full-width">
                    Creator

                    <input
                            type="text"
                            id="creator"
                            name="creator"
                            class="details-edit-input"
                    >
                </label>

                <label>
                    Version

                    <input
                            type="text"
                            id="version"
                            name="version"
                            class="details-edit-input"
                    >
                </label>

                <label>
                    Category

                    <select
                            id="category"
                            name="category"
                            class="details-edit-input"
                            required>

                        <option value="">
                            Select category
                        </option>

                    </select>
                </label>

                <label>
                    Subcategory

                    <input
                            type="text"
                            id="subCategory"
                            name="subCategory"
                            class="details-edit-input"
                    >
                </label>

                <label>
                    Base Model

                    <input
                            type="text"
                            id="baseModel"
                            name="baseModel"
                            class="details-edit-input"
                    >
                </label>

            </section>



            <section class="details-prompt-section">
                <div class="details-field-header">
                    <h2 class="details-field-label" id="positivePromptLabel">Trained Words</h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="positivePrompt" data-copy-label="Copy Trained Words" aria-label="Copy Trained Words" title="Copy Trained Words">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="positivePrompt" data-field-label="Trained Words" aria-label="Expand Trained Words" title="Expand Trained Words">⛶</button>
                    </div>
                </div>

                <textarea
                        id="positivePrompt"
                        aria-labelledby="positivePromptLabel"
                        name="positivePrompt"
                        class="details-edit-textarea"
                        rows="8"
                        placeholder="Enter the trained words..."></textarea>
            </section>


            <section class="details-prompt-section">
                <div class="details-field-header">
                    <h2 class="details-field-label" id="promptLabel">Prompt</h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="prompt" data-copy-label="Copy Prompt" aria-label="Copy Prompt" title="Copy Prompt">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="prompt" data-field-label="Prompt" aria-label="Expand Prompt" title="Expand Prompt">⛶</button>
                    </div>
                </div>
                <textarea id="prompt" name="prompt" aria-labelledby="promptLabel" class="details-edit-textarea" rows="8" maxlength="5000" placeholder="Enter the prompt..."></textarea>
            </section>

            <section class="details-prompt-section">
                <div class="details-field-header">
                    <h2 class="details-field-label" id="notesLabel">Notes</h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="notes" data-copy-label="Copy Notes" aria-label="Copy Notes" title="Copy Notes">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="notes" data-field-label="Notes" aria-label="Expand Notes" title="Expand Notes">⛶</button>
                    </div>
                </div>

                <textarea
                        id="notes"
                        aria-labelledby="notesLabel"
                        name="notes"
                        class="details-edit-textarea"
                        rows="6"
                        placeholder="Add notes about this LoRA..."></textarea>
            </section>


            <p
                    id="addLoraMessage"
                    class="details-edit-message hidden"
                    aria-live="polite">
            </p>



            <div class="shared-form-action-bar add-lora-action-bar">

                <a
                        href="/html/index.html"
                        class="details-cancel-button add-cancel-button">
                    Cancel
                </a>

                <button
                        type="submit"
                        id="saveLoraButton"
                        class="details-save-button">
                    Save LoRA
                </button>

            </div>

        </form>

    </div>

</main>

<div id="expandedFieldEditor" class="expanded-text-modal hidden" role="dialog" aria-modal="true" aria-labelledby="expandedFieldTitle" aria-hidden="true" inert>
    <section class="expanded-text-sheet">
        <header class="expanded-text-header">
            <h2 id="expandedFieldTitle">Edit text</h2>
            <button id="closeExpandedFieldEditor" class="close-button" type="button" aria-label="Apply expanded text and close">×</button>
        </header>
        <textarea id="expandedFieldValue" class="details-edit-textarea expanded-field-value" aria-label="Expanded text"></textarea>
    </section>
</div>

</body>
</html>
