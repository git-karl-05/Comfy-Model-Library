<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Edit LoRA</title>

    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/edit-field-tools.js" defer></script>
    <script src="/js/form-navigation.js" defer></script>
    <script src="/js/edit-lora.js" defer></script>

</head>

<body>

<main class="edit-lora-page record-form-page">

    <div class="edit-lora-container">

        <header class="edit-lora-header">

            <button
                    type="button"
                    id="optionsButton"
                    class="options-button"
                    aria-label="Open navigation menu"
                    aria-controls="sideMenu"
                    aria-expanded="false">
                ☰
            </button>

            <h1>Edit LoRA</h1>

            <button
                    type="button"
                    id="cancelEditHeaderButton"
                    class="page-close-button"
                    aria-label="Cancel editing and return"
                    title="Cancel">
                ×
            </button>

        </header>

        <div
                id="menuBackdrop"
                class="menu-backdrop hidden"
                aria-hidden="true">
        </div>

        <nav
                id="sideMenu"
                class="side-menu hidden"
                aria-label="Main navigation"
                aria-hidden="true">

            <div class="side-menu-header">

                <h2>Menu</h2>

                <button
                        type="button"
                        id="closeMenuButton"
                        class="menu-close-button"
                        aria-label="Close navigation menu">
                    ×
                </button>

            </div>

            <a
                    href="/html/index.html"
                    class="side-menu-link">
                LoRA Library
            </a>

            <a
                    href="/html/add-lora.html"
                    class="side-menu-link">
                Add LoRA
            </a>

        </nav>

        <form id="editLoraForm" class="edit-lora-form">


            <section class="edit-image-section">

                <label
                        id="editImagePreviewContainer"
                        class="details-image-container add-image-preview"
                        for="editPreviewImage">

                    <div class="lora-card-placeholder">
                        Click to replace the preview image
                    </div>

                    <button
                            type="button"
                            id="removeEditPreviewButton"
                            class="remove-preview-image-button hidden"
                            aria-label="Remove selected replacement image"
                            title="Remove selected replacement image">
                        ×
                    </button>

                </label>

                <input
                        type="file"
                        id="editPreviewImage"
                        name="previewImage"
                        class="hidden-file-input"
                        accept="image/png,image/jpeg,image/webp,image/gif,video/mp4"
                >

            </section>

            <section class="details-edit-grid edit-lora-details-grid">

                <label class="details-edit-full-width">
                    LoRA Name

                    <input
                            type="text"
                            id="editLoraName"
                            name="loraName"
                            class="details-edit-input"
                            required
                    >
                </label>

                <label class="details-edit-full-width">
                    Creator

                    <input
                            type="text"
                            id="editCreator"
                            name="creator"
                            class="details-edit-input"
                    >
                </label>

                <label>
                    Version

                    <input
                            type="text"
                            id="editVersion"
                            name="version"
                            class="details-edit-input"
                    >
                </label>

                <label>
                    Category

                    <select
                            id="editCategory"
                            name="category"
                            class="details-edit-input"
                            required>

                        <option value="">
                            Select category
                        </option>

                    </select>
                </label>

                <label>
                    Subcategory

                    <input
                            type="text"
                            id="editSubCategory"
                            name="subCategory"
                            class="details-edit-input"
                    >
                </label>

                <label>
                    Base Model

                    <input
                            type="text"
                            id="editBaseModel"
                            name="baseModel"
                            class="details-edit-input"
                    >
                </label>


            </section>



            <section class="details-prompt-section">

                <div class="details-field-header">
                    <h2 class="details-field-label" id="editPositivePromptLabel">Positive Prompt</h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="editPositivePrompt" data-copy-label="Copy Positive Prompt" aria-label="Copy Positive Prompt" title="Copy">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="editPositivePrompt" data-field-label="Positive Prompt" aria-label="Expand Positive Prompt" title="Expand">⛶</button>
                    </div>
                </div>
                <textarea
                        id="editPositivePrompt"
                        aria-labelledby="editPositivePromptLabel"
                        name="positivePrompt"
                        class="details-edit-textarea"
                        rows="8"
                        placeholder="Enter the positive prompt or trigger words..."></textarea>

            </section>




            <section class="details-prompt-section">

                <div class="details-field-header">
                    <h2 class="details-field-label" id="editNegativePromptLabel">Negative Prompt</h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="editNegativePrompt" data-copy-label="Copy Negative Prompt" aria-label="Copy Negative Prompt" title="Copy">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="editNegativePrompt" data-field-label="Negative Prompt" aria-label="Expand Negative Prompt" title="Expand">⛶</button>
                    </div>
                </div>
                <textarea
                        id="editNegativePrompt"
                        aria-labelledby="editNegativePromptLabel"
                        name="negativePrompt"
                        class="details-edit-textarea"
                        rows="8"
                        placeholder="Enter the negative prompt..."></textarea>

            </section>

            <section class="details-prompt-section">

                <div class="details-field-header">
                    <h2 class="details-field-label" id="editNotesLabel">Notes</h2>
                    <div class="details-field-actions">
                        <button type="button" class="copy-field-button" data-edit-copy="editNotes" data-copy-label="Copy Notes" aria-label="Copy Notes" title="Copy">⧉</button>
                        <button type="button" class="expand-field-button" data-edit-expand="editNotes" data-field-label="Notes" aria-label="Expand Notes" title="Expand">⛶</button>
                    </div>
                </div>
                <textarea
                        id="editNotes"
                        aria-labelledby="editNotesLabel"
                        name="notes"
                        class="details-edit-textarea"
                        rows="6"
                        placeholder="Add notes about this LoRA..."></textarea>

            </section>

            <p
                    id="editLoraMessage"
                    class="details-edit-message hidden"
                    aria-live="polite">
            </p>


            <div class="shared-form-action-bar edit-lora-action-bar">

                <button
                        type="button"
                        id="cancelEditActionButton"
                        class="details-cancel-button">
                    Cancel
                </button>

                <button
                        type="submit"
                        id="saveEditButton"
                        class="details-save-button">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</main>


<div id="expandedFieldEditor" class="expanded-text-modal hidden" role="dialog" aria-modal="true" aria-labelledby="expandedFieldTitle" aria-hidden="true" inert>
    <section class="expanded-text-sheet">
        <header class="expanded-text-header">
            <h2 id="expandedFieldTitle">Edit text</h2>
            <button id="closeExpandedFieldEditor" class="close-button" type="button" aria-label="Apply expanded text and close">×</button>
        </header>
        <textarea id="expandedFieldValue" class="details-edit-textarea expanded-field-value" aria-label="Expanded text"></textarea>
    </section>
</div>

</body>

</html>
