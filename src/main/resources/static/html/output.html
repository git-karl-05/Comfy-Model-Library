<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Choose a preview</title><link rel="stylesheet" href="/css/styles.css?v=uniform-filter-width-1"><script src="/js/appearance-settings.js?v=settings-pagination-1"></script><script src="/js/preview-media.js?v=video-posters-1" defer></script><script src="/js/output-date-groups.js?v=output-options-2" defer></script><script src="/js/output.js?v=output-options-5" defer></script></head>
<body><main class="app-container output-page"><div class="content-container">
<div class="library-navigation"><header class="top-toolbar"><button id="cancelOutput" class="page-close-button" aria-label="Return to form" type="button">←</button><h1 class="toolbar-title">Output</h1><button id="refreshOutput" class="layout-icon-button" type="button" aria-label="Refresh output" title="Refresh output"><span aria-hidden="true">↻</span></button></header>
<nav id="outputBreadcrumbs" class="pose-picker-breadcrumbs" aria-label="Output folders"></nav></div>
<section class="output-media-area"><p id="outputStatus" role="status" aria-live="polite"></p><details id="outputFolders" class="output-folders" hidden><summary id="outputFoldersSummary">Folders (0)</summary><div id="outputFolderList" class="output-folder-list"></div></details><div id="outputGrid" class="output-date-groups"></div>
<section id="outputFullPreview" class="output-full-preview hidden" tabindex="-1" aria-label="Selected preview"><div id="outputFullMedia"></div><div class="output-preview-overlay"><span id="previewPosition" role="status" aria-live="polite"></span><span id="previewName"></span><button id="closeOutputPreview" type="button" aria-label="Close preview">×</button></div></section><div id="outputPagination" class="pose-picker-pagination"><button id="outputPrevious" class="filter-reset-button" type="button">Previous</button><span id="outputPageNumber"></span><button id="outputNext" class="filter-reset-button" type="button">Next</button></div>
</section><footer class="shared-form-action-bar output-selection-bar"><button id="outputOptionsButton" class="details-cancel-button" type="button" aria-label="Filter &amp; Sort" title="Filter &amp; Sort" aria-haspopup="dialog"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="9" cy="18" r="2" fill="currentColor"/></svg><span>Filter &amp; Sort</span></button><button id="useOutput" class="details-save-button" type="button" disabled>Select</button></footer>
</div></main><dialog id="outputOptions" class="output-options-dialog" aria-labelledby="outputOptionsTitle"><header class="pose-picker-header"><h2 id="outputOptionsTitle">Filter &amp; Sort</h2><button id="closeOutputOptions" class="close-button" type="button" aria-label="Close filter and sort">×</button></header><fieldset class="output-option-group"><legend>File Type</legend><div id="outputFilter" class="output-option-buttons">
<button id="filterOutputAll" type="button" aria-pressed="true">All</button><button id="filterOutputImage" type="button" aria-pressed="false">Image</button><button id="filterOutputVideo" type="button" aria-pressed="false">Video</button>
</div></fieldset><fieldset class="output-option-group"><legend>Sort By</legend><div id="outputSort" class="output-option-buttons">
<button id="sortOutputName" type="button" aria-pressed="true">Name <span id="sortOutputNameDirection" aria-hidden="true">↑</span></button>
<button id="sortOutputCreated" type="button" aria-pressed="false">Created <span id="sortOutputCreatedDirection" aria-hidden="true"></span></button>
<button id="sortOutputModified" type="button" aria-pressed="false">Modified <span id="sortOutputModifiedDirection" aria-hidden="true"></span></button>
</div></fieldset></dialog></body></html>
