<!DOCTYPE html>
<html lang="en" class="library-gallery-page lora-library-page">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>LoRA Manager</title>
    <link rel="stylesheet" href="/css/styles.css?v=shared-gallery-polish-1">
    <script src="/js/appearance-settings.js?v=settings-library-sections-2"></script>
    <script src="/js/form-navigation.js?v=search-clear-visible-2" defer></script>
    <script src="/js/gallery-pagination.js?v=page-jump-1" defer></script>
    <script src="/js/gallery-header.js?v=lora-fixed-filter-gap-1" defer></script>
    <script src="/js/sheet-swipe.js?v=lora-pinned-header-1" defer></script>
    <script src="/js/preview-media.js?v=baseline-video-renderer-1" defer></script>
    <script src="/js/gallery-sort.js" defer></script>
    <script src="/js/app.js?v=lora-modal-background-playback-1" defer></script>
    <script src="/js/application-settings.js?v=desktop-1" defer></script>
</head>

<body>

<main class="app-container">

    <div class="content-container">

        <!-- Persistent Library Navigation -->
        <div class="library-navigation">

            <!-- Main Header -->
            <section class="top-toolbar">

                <button
                        id="optionsButton"
                        class="options-button"
                        type="button"
                        aria-label="Open options"
                        aria-controls="sideMenu"
                        aria-expanded="false"
                >
                    ☰
                </button>

                <h1 class="toolbar-title">
                    <button class="gallery-title-button" type="button" data-scroll-top aria-label="Library, scroll to top">Library</button>
                </h1>

                <div class="toolbar-right-actions">

                    <button
                            id="searchIconButton"
                            class="search-icon-button"
                            type="button"
                            aria-label="Open search"
                    >
                        🔍
                    </button>

                    <button
                            id="openActionMenuButton"
                            class="toolbar-action-button"
                            type="button"
                            aria-label="Open LoRA actions"
                            aria-controls="actionMenuOverlay"
                            aria-expanded="false"
                    >
                        ⋮
                    </button>

                </div>

                <!-- Search replaces only the main header -->
                <div
                        id="searchOverlay"
                        class="search-overlay hidden"
                >
                    <div class="search-input-wrapper"><input
                            type="text"
                            id="searchInput"
                            placeholder="Search LoRAs..."
                            class="search-input"
                    ><button id="clearSearchButton" class="search-clear-button" type="button" aria-label="Clear search text" title="Clear search" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>

                    <button
                            id="closeSearchButton"
                            class="search-close-button"
                            type="button"
                            aria-label="Turn off search"
                    ><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>

                </div>

            </section>


            <!-- Sort, Filter, and Layout Controls -->
            <section class="gallery-controls">

                <div class="gallery-action-controls">

                    <button
                            id="sortButton"
                            class="gallery-chip-button"
                            type="button"
                            aria-label="Sort LoRAs"
                            aria-controls="sortModal"
                            aria-expanded="false"
                    >
                    <span id="sortButtonText">
                        Sort
                    </span>

                        <span
                                id="sortButtonArrow"
                                class="hidden"
                                aria-hidden="true"
                        ></span>
                    </button>


                    <button
                            id="filterButton"
                            class="gallery-chip-button"
                            type="button"
                            aria-label="Filter LoRAs"
                            aria-controls="filterModal"
                            aria-expanded="false"
                    >

                    <span id="filterButtonText">
                        Filter
                    </span>

                        <span
                                id="filterCountBadge"
                                class="filter-count-badge hidden"
                        >
                        0
                    </span>

                    </button>


                </div>


                <div class="layout-icon-controls">

                    <button id="favoritesToggleButton" class="layout-icon-button" type="button"
                            aria-label="Favorites only" aria-pressed="false" title="Show favorites only">
                        <span id="favoritesToggleIcon" aria-hidden="true">☆</span>
                    </button>

                    <button
                            id="doubleColumnButton"
                            class="layout-icon-button"
                            type="button"
                            aria-label="Double-column layout"
                            aria-pressed="false"
                            title="Switch to double-column layout"
                    >
                        ▦
                    </button>

                </div>

            </section>


        </div>


        <!-- Gallery -->
        <section
                id="loraList"
                class="lora-list single-column"
        >
            <p class="empty-message" role="status">Loading library…</p>
        </section>


        <!-- Pagination -->
        <section
                id="paginationControls"
                class="pagination-controls hidden"
                aria-label="Gallery pagination"
        >

            <button
                    id="previousPageButton"
                    class="pagination-button"
                    type="button"
            >
                Previous
            </button>

            <span
                    id="pageIndicator"
                    class="page-indicator"
                    aria-live="polite"
            >
                Page 1 of 1
            </span>

            <button
                    id="nextPageButton"
                    class="pagination-button"
                    type="button"
            >
                Next
            </button>

        </section>

    </div>


    <!-- Side Menu -->
    <nav
            id="sideMenu"
            class="side-menu hidden"
            aria-label="Main menu"
    >

        <div class="side-menu-header">

            <h2>Menu</h2>


        </div>

        <a
                href="/html/index.html"
                class="side-menu-link active"
        ><span class="compact-action-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h5v16H4zM10 4h5v16h-5zM17 4l4 1-3 15-4-1z"/></svg></span><span>Library</span></a>

        <a
                href="/html/poses.html"
                class="side-menu-link"
        ><span class="compact-action-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg></span><span>Gallery</span></a>

    </nav>


    <div
            id="menuBackdrop"
            class="menu-backdrop hidden"
            aria-hidden="true"
    ></div>


    <!-- LoRA Action Menu -->
    <div
            id="actionMenuOverlay"
            class="action-menu-overlay hidden"
    >

        <section
                id="actionMenuPopover"
                class="action-menu-popover"
                role="dialog"
                aria-label="LoRA actions"
        >

            <button
                    id="refreshLorasButton"
                    class="compact-action-button"
                    type="button"
                    title="Refresh LoRA library and filter options"
            >
                <span class="compact-action-icon" aria-hidden="true">↻</span>
                <span id="refreshLorasLabel">Refresh</span>
            </button>

            <button
                    id="addLoraActionButton"
                    class="compact-action-button"
                    type="button"
            >

                    <span
                            class="compact-action-icon"
                            aria-hidden="true"
                    >
                        ＋
                    </span>

                <span>
                        Add LoRA
                    </span>

            </button>




        </section>

    </div>


    <!--
        Only this row is sticky.
        The main header above scrolls normally.
    -->


    <!-- Go To Top -->
    <button
            id="goTopButton"
            class="go-top-button hidden"
            type="button"
            aria-label="Go to top"
            title="Go to top"
    >
        ↑
    </button>

</main>

<!-- Sort Modal -->
<div
        id="sortModal"
        class="filter-modal hidden"
        aria-hidden="true"
        inert
>

    <div
            id="sortModalBackdrop"
            class="filter-modal-backdrop"
    ></div>


    <section
            class="filter-sheet"
            role="dialog"
            aria-modal="true"
            aria-labelledby="sortSheetTitle"
    >

        <div class="sheet-drag-handle"></div>


        <div class="filter-sheet-header">

            <h2 id="sortSheetTitle">
                Sort
            </h2>

            <button
                    id="closeSortButton"
                    class="filter-close-button"
                    type="button"
                    aria-label="Close sort"
            >
                ×
            </button>

        </div>


        <div class="filter-sheet-content">

            <button
                    class="compact-action-button sort-option-button"
                    type="button"
                    data-sort-field="loraName"
                    data-sort-label="Name"
            >
                <span>
                    Name
                </span>

                <span
                        class="sort-direction-arrow"
                        aria-hidden="true"
                ></span>
            </button>


            <button
                    class="compact-action-button sort-option-button"
                    type="button"
                    data-sort-field="creator"
                    data-sort-label="Creator"
            >
                <span>
                    Creator
                </span>

                <span
                        class="sort-direction-arrow"
                        aria-hidden="true"
                ></span>
            </button>

            <button class="compact-action-button sort-option-button" type="button"
                    data-sort-field="category"
                    data-sort-label="Category">
                <span>Category</span>
                <span class="sort-direction-arrow" aria-hidden="true"></span>
            </button>

            <button class="compact-action-button sort-option-button" type="button"
                    data-sort-field="subCategory"
                    data-sort-label="Subcategory">
                <span>Subcategory</span>
                <span class="sort-direction-arrow" aria-hidden="true"></span>
            </button>

            <button class="compact-action-button sort-option-button" type="button"
                    data-sort-field="baseModel"
                    data-sort-label="Base Model">
                <span>Base Model</span>
                <span class="sort-direction-arrow" aria-hidden="true"></span>
            </button>

        </div>

        <div class="filter-sheet-actions">
            <button id="resetSortButton" class="filter-reset-button" type="button" disabled>Reset</button>
        </div>

    </section>

</div>

<!-- Filter Modal -->
<div
        id="filterModal"
        class="filter-modal hidden"
        aria-hidden="true"
        inert
>

    <div
            id="filterModalBackdrop"
            class="filter-modal-backdrop"
    ></div>


    <section
            class="filter-sheet"
            role="dialog"
            aria-modal="true"
            aria-labelledby="filterSheetTitle"
    >

        <div class="sheet-drag-handle"></div>


        <div class="filter-sheet-header">

            <h2 id="filterSheetTitle">
                Filter
            </h2>

            <button
                    id="closeFilterButton"
                    class="filter-close-button"
                    type="button"
                    aria-label="Close filters"
            >
                ×
            </button>

        </div>


        <div class="filter-sheet-content">

            <label
                    class="filter-field-label"
                    for="baseModelFilter"
            >
                Base Model
            </label>

            <select
                    id="baseModelFilter"
                    class="category-filter"
            >
                <option value="ALL" hidden disabled selected>Select a base model</option>
            </select>


            <label
                    class="filter-field-label"
                    for="categoryFilter"
            >
                Category
            </label>

            <select
                    id="categoryFilter"
                    class="category-filter"
                    disabled
            >
                <option value="ALL" hidden disabled selected>Select a category</option>
            </select>


            <label
                    class="filter-field-label"
                    for="subcategoryFilter"
            >
                Subcategory
            </label>

            <select
                    id="subcategoryFilter"
                    class="category-filter"
            >
                <option value="ALL" hidden disabled selected>Select a subcategory</option>
            </select>

        </div>


        <div class="filter-sheet-actions">

            <button
                    id="resetFilterButton"
                    class="filter-reset-button"
                    type="button"
            >
                Reset
            </button>

            <button
                    id="applyFilterButton"
                    class="filter-apply-button"
                    type="button"
            >
                Apply Filter
            </button>

        </div>

    </section>

</div>


<!-- LoRA Details Modal -->
<div
        id="loraDetailsModal"
        class="modal-overlay hidden"
        aria-hidden="true"
>

    <section
            class="lora-details-sheet"
            role="dialog"
            aria-modal="true"
            aria-labelledby="detailsLoraName"
    >

        <!-- Details Header -->
        <div class="sheet-header" data-sheet-drag-handle>

            <div
                    id="detailsHeaderView"
                    class="details-header-view"
            >

                <div class="details-title-container">

                    <h2 id="detailsLoraName">
                        LoRA Name
                    </h2>

                </div>


                <div class="details-actions">

                    <div id="loraDetailsMoreActions" class="details-more-actions">
                        <button id="loraDetailsActionsButton" class="icon-button" type="button"
                                aria-label="LoRA actions" title="LoRA actions" aria-haspopup="menu"
                                aria-controls="loraDetailsActionsMenu" aria-expanded="false">⋮</button>
                        <div id="loraDetailsActionsMenu" class="lora-details-actions-menu" role="menu" aria-label="LoRA actions" hidden>
                            <button id="favoriteLoraDetailsButton" class="compact-action-button" type="button" role="menuitemcheckbox" aria-checked="false">
                                <span id="favoriteLoraDetailsIcon" class="compact-action-icon" aria-hidden="true">☆</span>
                                <span id="favoriteLoraDetailsLabel">Favorite</span>
                            </button>
                            <button id="editLoraButton" class="compact-action-button" type="button" role="menuitem">
                                <span class="compact-action-icon" aria-hidden="true">✏</span><span>Edit</span>
                            </button>
                            <button id="archiveLoraButton" class="compact-action-button" type="button" role="menuitem">
                                <span class="compact-action-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3h18v5H3zM5 8v13h14V8M9 12h6"/></svg></span><span id="archiveLoraLabel">Archive</span>
                            </button>
                        </div>
                    </div>


                </div>

            </div>

        </div>


        <div class="lora-details-scroll-area">

            <!-- Preview Carousel -->
            <div class="details-carousel" role="region" aria-label="LoRA previews" aria-roledescription="carousel" tabindex="0">

                <div class="details-carousel-preview">

                    <button
                            id="previousPreviewButton"
                            class="carousel-navigation-button carousel-previous-button hidden"
                            type="button"
                            aria-label="Previous preview"
                            aria-controls="detailsImageContainer"
                            title="Previous preview"
                    >
                        ‹
                    </button>


                    <div
                            id="detailsImageContainer"
                            class="details-image-container"
                    >

                        <div class="lora-card-placeholder">
                            No Image
                        </div>

                    </div>


                    <button id="previewPromptButton" class="preview-prompt-button hidden"
                            type="button" title="Show preview prompt" aria-label="Show preview prompt"
                            aria-haspopup="dialog">i</button>

                    <button
                            id="nextPreviewButton"
                            class="carousel-navigation-button carousel-next-button hidden"
                            type="button"
                            aria-label="Next preview"
                            aria-controls="detailsImageContainer"
                            title="Next preview"
                    >
                        ›
                    </button>

                </div>


                <div
                        id="previewIndicators"
                        class="preview-indicators hidden"
                        aria-label="Preview selection"
                        role="group"
                ></div>

                <p id="previewStatus" class="preview-status" role="status" aria-live="polite" aria-atomic="true"></p>

            </div>


            <!-- LoRA Information -->
            <section
                    id="detailsInfoView"
                    class="details-info"
            >

                <p>
                    <strong>Creator:</strong>
                    <span id="detailsCreator">
                        N/A
                    </span>
                </p>

                <p>
                    <strong>Version:</strong>
                    <span id="detailsVersion">
                        N/A
                    </span>
                </p>

                <p>
                    <strong>Category:</strong>
                    <span id="detailsCategory">
                        N/A
                    </span>
                </p>

                <p>
                    <strong>Subcategory:</strong>
                    <span id="detailsSubCategory">
                        N/A
                    </span>
                </p>

                <p>
                    <strong>Base Model:</strong>
                    <span id="detailsBaseModel">
                        N/A
                    </span>
                </p>

            </section>


            <!-- Trained Words / Prompt / Notes -->
            <section
                    id="detailsPromptView"
                    class="details-prompt-view"
            >

                <!-- Trained Words -->
                <div class="details-field">

                    <div class="details-field-header">

                        <span class="details-field-label">
                            Trained Words
                        </span>


                        <div class="details-field-actions">
                            <button
                                    type="button"
                                    class="copy-field-button"
                                    data-copy-target="detailsPositivePrompt"
                                    aria-label="Copy trained words"
                                    title="Copy trained words"
                            >⧉</button>
                            <button
                                    type="button"
                                    class="expand-field-button"
                                    data-expand-target="detailsPositivePrompt"
                                    data-expand-title="Trained Words"
                                    aria-label="Expand trained words"
                                    title="Expand"
                            >
                                ⛶
                            </button>
                        </div>

                    </div>


                    <div
                            id="detailsPositivePrompt"
                            class="details-field-value details-long-text"
                    >
                        No trained words saved.
                    </div>

                </div>


                <!-- Prompt -->
                <div class="details-field">

                    <div class="details-field-header">

                        <span class="details-field-label">
                            Prompt
                        </span>


                        <div class="details-field-actions">
                            <button
                                    type="button"
                                    class="copy-field-button"
                                    data-copy-target="detailsPrompt"
                                    aria-label="Copy prompt"
                                    title="Copy prompt"
                            >⧉</button>
                            <button
                                    type="button"
                                    class="expand-field-button"
                                    data-expand-target="detailsPrompt"
                                    data-expand-title="Prompt"
                                    aria-label="Expand prompt"
                                    title="Expand"
                            >
                                ⛶
                            </button>
                        </div>

                    </div>


                    <div
                            id="detailsPrompt"
                            class="details-field-value details-long-text"
                    >
                        No prompt saved.
                    </div>

                </div>

                <!-- Notes -->
                <div class="details-field">

                    <div class="details-field-header">

                        <span class="details-field-label">
                            Notes
                        </span>


                        <div class="details-field-actions">
                            <button
                                    type="button"
                                    class="copy-field-button"
                                    data-copy-target="detailsNotes"
                                    aria-label="Copy notes"
                                    title="Copy notes"
                            >⧉</button>
                            <button
                                    type="button"
                                    class="expand-field-button"
                                    data-expand-target="detailsNotes"
                                    data-expand-title="Notes"
                                    aria-label="Expand notes"
                                    title="Expand"
                            >
                                ⛶
                            </button>
                        </div>

                    </div>


                    <div
                            id="detailsNotes"
                            class="details-field-value details-long-text"
                    >
                        No notes saved.
                    </div>

                </div>

            </section>


            <p
                    id="detailsEditMessage"
                    class="details-edit-message hidden"
                    aria-live="polite"
            ></p>

        </div>

    </section>

</div>


<!-- Expanded Text Modal -->
<div
        id="expandedTextModal"
        class="expanded-text-modal hidden"
        aria-hidden="true"
>

    <section
            class="expanded-text-sheet"
            role="dialog"
            aria-modal="true"
            aria-labelledby="expandedTextTitle"
    >

        <div class="expanded-text-header">

            <h2 id="expandedTextTitle">
                Text
            </h2>

            <button id="copyPreviewPromptButton" class="copy-field-button hidden"
                    type="button" data-copy-target="expandedTextContent"
                    aria-label="Copy preview prompt" title="Copy preview prompt">⧉</button>

            <button
                    id="closeExpandedTextButton"
                    class="close-button"
                    type="button"
                    aria-label="Close expanded text"
            >
                ×
            </button>

        </div>


        <div
                id="expandedTextContent"
                class="expanded-text-content"
        ></div>

    </section>

</div>

<dialog id="notesImportListDialog" class="notes-import-dialog" aria-labelledby="notesImportListTitle">
    <div class="notes-import-dialog-header">
        <h2 id="notesImportListTitle"></h2>
        <button id="closeNotesImportList" class="close-button" type="button" aria-label="Close import list">×</button>
    </div>
    <div id="notesImportListContent" class="notes-import-list-content"></div>
</dialog>

<section id="libraryDataTools" class="settings-data-tools" data-library="loras" hidden>
    <h4>LoRA</h4>
            <button id="backupMenuButton" class="compact-action-button" type="button"
                    aria-expanded="false" aria-controls="backupOptions" title="JSON backup options">
                <span class="compact-action-icon" aria-hidden="true">▣</span>
                <span>LoRA Backup</span>
            </button>
            <div id="backupOptions" class="backup-options hidden">
                <button id="exportBackupButton" class="compact-action-button" type="button"
                        title="Export library as a JSON backup">
                    <span class="compact-action-icon" aria-hidden="true">↓</span>
                    <span>Export LoRA Backup (JSON)</span>
                </button>
                <button id="importBackupButton" class="compact-action-button" type="button"
                        title="Import a LoRA JSON backup">
                    <span class="compact-action-icon" aria-hidden="true">↑</span>
                    <span>Import LoRA Backup (JSON)</span>
                </button>
            </div>

            <button
                    id="showImportFolderButton"
                    class="compact-action-button"
                    type="button"
            >

                    <span
                            class="compact-action-icon folder-icon"
                            aria-hidden="true"
                    >
                        📁
                    </span>

                <span>
                        Import LoRA Folder
                    </span>

            </button>


            <button id="importNotesButton" class="compact-action-button" type="button">
                <span class="compact-action-icon" aria-hidden="true">📄</span>
                <span>Import LoRA Notes</span>
            </button>
            <input id="notesFileInput" class="hidden-file-input" type="file" accept=".txt,.text,text/plain">
            <div id="notesImportResult" class="import-result hidden" role="status" aria-live="polite"></div>

            <form
                    id="importFolderForm"
                    class="import-folder-form hidden"
            >

                <label for="importFolderPath">
                    LoRA folder path
                </label>

                <input
                        type="text"
                        id="importFolderPath"
                        placeholder="C:/Users/.../ComfyUI/models/loras"
                        required
                >

                <button
                        id="importFolderSubmitButton"
                        class="submit-button"
                        type="submit"
                >
                    Scan and Import
                </button>

            </form>


            <div
                    id="importResult"
                    class="import-result hidden"
                    role="status"
                    aria-live="polite"
            ></div>


            <input
                    id="backupFileInput"
                    class="hidden-file-input"
                    type="file"
                    accept=".json,application/json"
            >
</section>
</body>
</html>
