<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>LoRA Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/app.js" defer></script>
</head>

<body>

<main class="app-container">

    <div class="content-container">
        <div class="sticky-navigation">
            <section class="top-toolbar">
                <button
                        id="optionsButton"
                        class="options-button"
                        type="button"
                        aria-label="Open options"
                        aria-controls="sideMenu"
                        aria-expanded="false">
                    ☰
                </button>

                <h1 class="toolbar-title">LoRA Library</h1>

                <div class="toolbar-right-actions">
                    <button id="searchIconButton" class="search-icon-button" aria-label="Open search">
                        🔍
                    </button>

                    <button id="openActionMenuButton" class="toolbar-action-button" type="button" aria-label="Open LoRA actions">
                        ⋮
                    </button>
                </div>

                <div id="searchOverlay" class="search-overlay hidden">
                    <input
                            type="text"
                            id="searchInput"
                            placeholder="Search LoRAs..."
                            class="search-input"
                    >

                    <button id="closeSearchButton" class="search-close-button" aria-label="Close search">
                        ×
                    </button>
                </div>
            </section>

            <nav
                    id="sideMenu"
                    class="side-menu hidden"
                    aria-label="Main menu">

                <div class="side-menu-header">
                    <h2>Menu</h2>

                    <button
                            id="closeMenuButton"
                            class="menu-close-button"
                            type="button"
                            aria-label="Close menu">
                        ×
                    </button>
                </div>

                <a
                        href="/html/index.html"
                        class="side-menu-link active">
                    LoRA Library
                </a>

                <a
                        href="/html/add-lora.html"
                        class="side-menu-link">
                    Add LoRA
                </a>

            </nav>

            <div
                    id="menuBackdrop"
                    class="menu-backdrop hidden"
                    aria-hidden="true">
            </div>

            <div id="actionMenuOverlay" class="action-menu-overlay hidden">

                <section
                        id="actionMenuPopover"
                        class="action-menu-popover"
                        role="dialog"
                        aria-label="LoRA actions">

                    <button
                            id="addLoraActionButton"
                            class="compact-action-button"
                            type="button">

                <span class="compact-action-icon" aria-hidden="true">
                    ＋
                </span>

                        <span>Add LoRA</span>

                    </button>

                    <button
                            id="showImportFolderButton"
                            class="compact-action-button"
                            type="button">

                <span class="compact-action-icon folder-icon" aria-hidden="true">
                    📁
                </span>

                        <span>Import LoRA</span>

                    </button>

                    <form id="importFolderForm" class="import-folder-form hidden">

                        <label for="importFolderPath">
                            LoRA folder path
                        </label>

                        <input
                                type="text"
                                id="importFolderPath"
                                placeholder="C:/Users/.../ComfyUI/models/loras"
                                required
                        >

                        <button
                                id="importFolderSubmitButton"
                                class="submit-button"
                                type="submit">
                            Scan and Import
                        </button>

                    </form>

                    <div
                            id="importResult"
                            class="import-result hidden"
                            role="status"
                            aria-live="polite"
                    ></div>



                </section>

            </div>

            <div class="gallery-controls">

                <div class="gallery-action-controls">

                    <button
                            id="sortButton"
                            class="gallery-chip-button"
                            type="button"
                            disabled
                            aria-label="Sort LoRAs"
                    >
                        <span>Sort</span>
                    </button>

                    <button
                            id="filterButton"
                            class="gallery-chip-button"
                            type="button"
                            aria-label="Filter LoRAs"
                            aria-controls="filterModal"
                            aria-expanded="false"
                    >
                <span id="filterButtonText">
                    Filter
                </span>

                        <span
                                id="filterCountBadge"
                                class="filter-count-badge hidden"
                        >
                    0
                </span>
                    </button>

                </div>

                <div class="layout-icon-controls">

                    <button
                            id="singleColumnButton"
                            class="layout-icon-button active"
                            type="button"
                            aria-label="Single-column layout"
                    >
                        ☰
                    </button>

                    <button
                            id="doubleColumnButton"
                            class="layout-icon-button"
                            type="button"
                            aria-label="Double-column layout"
                    >
                        ▦
                    </button>

                </div>

            </div>
        </div>

        <section id="loraList" class="lora-list single-column">
            <!-- LoRA cards will be loaded here by JavaScript -->
        </section>

        <section
                id = "paginationControls"
                class = "pagination-controls hidden"
                aria-label="Gallery pagination"
        >
            <button
                    id = "previousPageButton"
                    class="pagination-button"
                    type="button"
            >
                Previous
            </button>

            <span
                    id="pageIndicator"
                    class = "page-indicator"
                    aria-live="polite"
            >
            Page 1 of 1
            </span>

            <button
                    id = "nextPageButton"
                    class = "pagination-button"
                    type="button"
            >
                Next
            </button>
        </section>

    </div>



    <button
            id="goTopButton"
            class="go-top-button hidden"
            type="button"
            aria-label="Go to top"
            title="Go to top">
        ↑
    </button>

</main>


<div
        id="filterModal"
        class="filter-modal hidden"
        aria-hidden="true"
        inert
>

    <div
            id="filterModalBackdrop"
            class="filter-modal-backdrop"
    ></div>

    <section
            class="filter-sheet"
            role="dialog"
            aria-modal="true"
            aria-labelledby="filterSheetTitle"
    >

        <div class="sheet-drag-handle"></div>

        <div class="filter-sheet-header">

            <h2 id="filterSheetTitle">
                Filter
            </h2>

            <button
                    id="closeFilterButton"
                    class="filter-close-button"
                    type="button"
                    aria-label="Close filters"
            >
                ×
            </button>

        </div>

        <div class="filter-sheet-content">

            <label
                    class="filter-field-label"
                    for="baseModelFilter"
            >
                Base Model
            </label>

            <select
                    id="baseModelFilter"
                    class="category-filter"
            >
                <option value="ALL">
                    All Base Models
                </option>
                <option value="ILLUSTRIOUS">
                    Illustrious
                </option>
                <option value="KREA">
                    Krea 2
                </option>
                <option value="PONY">
                    Pony
                </option>
                <option value="Wan Video 2.2 I2V-A14B">
                    WAN 2.2
                </option>

            </select>

            <label
                    class="filter-field-label"
                    for="categoryFilter"
            >
                Category
            </label>

            <select
                    id="categoryFilter"
                    class="category-filter"
            >
                <option value="ALL">
                    All Categories
                </option>

                <option value="FAVORITES">
                    Favorites
                </option>

                <option value="BACKGROUND">
                    Background
                </option>

                <option value="CHARACTER">
                    Character
                </option>

                <option value="CONCEPT">
                    Concept
                </option>

                <option value="ENHANCER">
                    Enhancer
                </option>

                <option value="OUTFIT">
                    Outfit
                </option>

                <option value="POSES">
                    Poses
                </option>

                <option value="SLIDER">
                    Slider
                </option>

                <option value="STYLE">
                    Style
                </option>
            </select>

            <label
                    class="filter-field-label"
                    for= "subcategoryFilter" >
                Subcategory
            </label>
            <select
                    id="subcategoryFilter"
                    class="category-filter"
            >
                <option value = "ALL">
                    All Subcategories
                </option>
                <option value="ANIME">
                    Anime
                </option>
                <option value="HORROR">
                    Horror
                </option>
                <option value="REALISTIC">
                    Realistic
                </option>

            </select>

        </div>

        <div class="filter-sheet-actions">

            <button
                    id="resetFilterButton"
                    class="filter-reset-button"
                    type="button"
            >
                Reset
            </button>

            <button
                    id="applyFilterButton"
                    class="filter-apply-button"
                    type="button"
            >
                Apply Filter
            </button>

        </div>

    </section>

</div>

<div id="loraDetailsModal" class="modal-overlay hidden" aria-hidden="true">

    <section class="lora-details-sheet" role="dialog" aria-modal="true" aria-labelledby="detailsLoraName">

        <div class="sheet-drag-handle" aria-hidden="true"></div>

        <div class="lora-details-scroll-area">

            <div class="sheet-header">

                <div id="detailsHeaderView" class="details-header-view">

                    <div class="details-title-container">
                        <h2 id="detailsLoraName">LoRA Name</h2>
                    </div>

                    <div class="details-actions">
                        <button
                                id="editLoraButton"
                                class="icon-button"
                                type="button"
                                aria-label="Edit LoRA"
                                title="Edit LoRA">
                            ✏
                        </button>

                        <button
                                id="closeLoraDetailsButton"
                                class="close-button"
                                type="button"
                                aria-label="Close LoRA details">
                            ×
                        </button>
                    </div>

                </div>

            </div>

            <div class="details-carousel">

                <div class="details-carousel-preview">

                    <button
                            id="previousPreviewButton"
                            class="carousel-navigation-button carousel-previous-button hidden"
                            type="button"
                            aria-label="Previous preview">
                        ‹
                    </button>

                    <div
                            id="detailsImageContainer"
                            class="details-image-container">

                        <div class="lora-card-placeholder">
                            No Image
                        </div>

                    </div>

                    <button
                            id="nextPreviewButton"
                            class="carousel-navigation-button carousel-next-button hidden"
                            type="button"
                            aria-label="Next preview">
                        ›
                    </button>

                </div>

                <div
                        id="previewIndicators"
                        class="preview-indicators hidden"
                        aria-label="Preview selection">
                </div>

            </div>

            <section id="detailsInfoView" class="details-info">

                <p>
                    <strong>Creator:</strong>
                    <span id="detailsCreator">N/A</span>
                </p>
                <p>
                    <strong>Version:</strong>
                    <span id="detailsVersion">N/A</span>
                </p>

                <p>
                    <strong>Category:</strong>
                    <span id="detailsCategory">N/A</span>
                </p>

                <p>
                    <strong>Subcategory:</strong>
                    <span id="detailsSubCategory">N/A</span>
                </p>

                <p>
                    <strong>Base Model:</strong>
                    <span id="detailsBaseModel">N/A</span>
                </p>

            </section>

            <section id="detailsPromptView" class="details-prompt-view">

                <div class="details-field">

                    <div class="details-field-header">

            <span class="details-field-label">
                Trained Words
            </span>

                        <button
                                type="button"
                                class="copy-field-button"
                                data-copy-target="detailsPositivePrompt"
                                aria-label="Copy trained words"
                                title="Copy trained words">
                            Copy
                        </button>

                    </div>

                    <div
                            id="detailsPositivePrompt"
                            class="details-field-value details-long-text">
                        No trained words saved.
                    </div>

                </div>

                <div class="details-field">

                    <div class="details-field-header">

            <span class="details-field-label">
                Notes
            </span>

                        <button
                                type="button"
                                class="copy-field-button"
                                data-copy-target="detailsNotes"
                                aria-label="Copy notes"
                                title="Copy notes">
                            Copy
                        </button>

                    </div>

                    <div
                            id="detailsNotes"
                            class="details-field-value details-long-text">
                        No notes saved.
                    </div>

                </div>

            </section>

            <p
                    id="detailsEditMessage"
                    class="details-edit-message hidden"
                    aria-live="polite">
            </p>


        </div>


    </section>


</div>
</body>
</html>
