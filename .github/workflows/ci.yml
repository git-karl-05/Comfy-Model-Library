name: CI pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and test
        run: ./mvnw clean package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/comfy-model-library:latest \
            -t ghcr.io/${{ github.repository_owner }}/comfy-model-library:${{ github.sha }} \
          .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/comfy-model-library:latest
          docker push ghcr.io/${{ github.repository_owner }}/comfy-model-library:${{ github.sha }}




